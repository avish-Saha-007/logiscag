name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: pytest -v

      - name: Run the no-SDV verification path
        run: python -m logiscag.reproduce --verify

  # The SDV-dependent path is a separate, non-blocking job: SDV pulls in torch,
  # which is slow to install and periodically breaks against new numpy/pandas
  # releases. Keeping it out of the required matrix means a downstream
  # dependency break does not turn the whole suite red, while still surfacing
  # the breakage. See KNOWN_ISSUES.md.
  test-with-sdv:
    name: pytest with SDV (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with the SDV extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v
